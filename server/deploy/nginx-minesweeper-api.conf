# Minesweeper leaderboard API. Included from the 443 server block of /etc/nginx/sites-available/eliasv-com
# (installed as /etc/nginx/snippets/minesweeper-api.conf by server/deploy/deploy.sh).
location /minesweeper/api/ {
    proxy_pass http://127.0.0.1:3890/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    client_max_body_size 16k;
    gzip off;
}
# The static site is a copy of the repo: never serve the server's source, deploy files or anything else in it.
location ^~ /minesweeper/server/ { return 404; }
location ^~ /minesweeper/test/ { return 404; }
